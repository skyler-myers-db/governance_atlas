<!doctype html>
<!-- data-theme="dark" is set statically (not just by AppFrame's effect) so the
     :root[data-theme="dark"] override layer applies from the very first
     React-rendered frame — otherwise the loading states between preboot and
     AppFrame mount render with legacy light base rules ("old shell" flash). -->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Governance Atlas metadata workspace built on Unity Catalog."
    />
    <meta name="theme-color" content="#050e18" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23061321'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='%2366c5ff' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%235ce1e6'/%3E%3Cpath d='M32 15v-6M32 55v-6M15 32h-6M55 32h-6' stroke='%233d84ad' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>Governance Atlas</title>
    <style>
      /* Preboot skeleton — must visually match the live dark shell so first
         paint and app hydration are seamless. Tokens mirror
         src/design/tokens/colors.css (kept inline: this renders before any
         bundle loads). Any light/cream surface here is a bug. */
      :root {
        color-scheme: dark;
        --ga-preboot-shell: #050e18;
        --ga-preboot-bg: #08172a;
        --ga-preboot-surface: rgba(12, 33, 56, 0.96);
        --ga-preboot-line: rgba(31, 63, 95, 0.96);
        --ga-preboot-text: #f5fbff;
        --ga-preboot-text-soft: #cfefff;
        --ga-preboot-text-muted: #8fa8b6;
        --ga-preboot-accent: #66c5ff;
        --ga-preboot-accent-2: #3d84ad;
      }
      html, body, #root {
        min-height: 100%;
      }
      body {
        margin: 0;
        font-family: "SF Pro Text", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI Variable Text", sans-serif;
        background: var(--ga-preboot-shell);
        color: var(--ga-preboot-text);
      }
      .ga-preboot {
        display: grid;
        grid-template-rows: 56px minmax(0, 1fr);
        min-height: 100vh;
      }
      .ga-preboot-topbar {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 18px;
        background: var(--ga-preboot-bg);
        border-bottom: 1px solid var(--ga-preboot-line);
      }
      .ga-preboot-mark {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #025080 0%, #3d84ad 100%);
        color: var(--ga-preboot-text);
        font-weight: 800;
        font-size: 0.72rem;
        letter-spacing: 0.06em;
      }
      .ga-preboot-brand strong {
        font-size: 0.98rem;
        letter-spacing: -0.01em;
      }
      .ga-preboot-brand span {
        display: block;
        font-size: 0.68rem;
        color: var(--ga-preboot-text-muted);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .ga-preboot-search {
        margin-left: auto;
        width: min(480px, 40vw);
        height: 34px;
        border: 1px solid var(--ga-preboot-line);
        border-radius: 10px;
        background: rgba(12, 33, 56, 0.68);
        display: flex;
        align-items: center;
        padding: 0 14px;
        color: var(--ga-preboot-text-muted);
        font-size: 0.8rem;
      }
      .ga-preboot-body {
        display: grid;
        grid-template-columns: 240px minmax(0, 1fr);
        background: var(--ga-preboot-bg);
        min-height: 0;
      }
      .ga-preboot-rail {
        border-right: 1px solid var(--ga-preboot-line);
        background: var(--ga-preboot-shell);
        padding: 18px 14px;
        display: grid;
        gap: 10px;
        align-content: start;
      }
      .ga-preboot-rail span,
      .ga-preboot-cards span,
      .ga-preboot-rows span {
        display: block;
        border-radius: 10px;
        border: 1px solid var(--ga-preboot-line);
        background: linear-gradient(
          90deg,
          rgba(12, 33, 56, 0.9) 0%,
          rgba(20, 50, 79, 0.9) 50%,
          rgba(12, 33, 56, 0.9) 100%
        );
        background-size: 220% 100%;
        animation: ga-preboot-shimmer 1.6s ease-in-out infinite;
      }
      .ga-preboot-rail span {
        height: 34px;
      }
      .ga-preboot-main {
        padding: 22px;
        display: grid;
        gap: 16px;
        align-content: start;
      }
      .ga-preboot-status {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--ga-preboot-text-soft);
        font-size: 0.86rem;
      }
      .ga-preboot-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--ga-preboot-accent);
        animation: ga-preboot-pulse 1.4s ease-in-out infinite;
      }
      .ga-preboot-cards {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
      }
      .ga-preboot-cards span {
        height: 96px;
        border-radius: 14px;
      }
      .ga-preboot-rows {
        display: grid;
        gap: 10px;
      }
      .ga-preboot-rows span {
        height: 48px;
      }
      @keyframes ga-preboot-shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -20% 0; }
      }
      @keyframes ga-preboot-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      @media (max-width: 900px) {
        .ga-preboot-body {
          grid-template-columns: 1fr;
        }
        .ga-preboot-rail {
          display: none;
        }
        .ga-preboot-cards {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ga-preboot-rail span,
        .ga-preboot-cards span,
        .ga-preboot-rows span,
        .ga-preboot-dot {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="ga-preboot">
        <div class="ga-preboot-topbar">
          <div class="ga-preboot-mark">GA</div>
          <div class="ga-preboot-brand">
            <strong>Governance Atlas</strong>
            <span>Metadata Workspace</span>
          </div>
          <div class="ga-preboot-search">Search assets, domains, owners, tags…</div>
        </div>
        <div class="ga-preboot-body">
          <div class="ga-preboot-rail">
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
          </div>
          <div class="ga-preboot-main">
            <div class="ga-preboot-status">
              <div class="ga-preboot-dot"></div>
              Preparing your governance workspace…
            </div>
            <div class="ga-preboot-cards">
              <span></span><span></span><span></span><span></span>
            </div>
            <div class="ga-preboot-rows">
              <span></span><span></span><span></span><span></span><span></span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
